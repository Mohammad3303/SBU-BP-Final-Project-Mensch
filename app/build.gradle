plugins { id 'com.android.application' }

android {
    namespace 'com.elyac.proplanner'
    compileSdk 35
    defaultConfig {
        applicationId 'com.elyac.proplanner'
        minSdk 24
        targetSdk 35
        versionCode 9010003
        versionName '1.10.9-test3'
    }
    buildTypes {
        debug {}
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
